<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품구매</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <h1>제주 천혜농</h1>
    <form>
      <label for="r">받는분 성함</label>
      <input type="text" placeholder="예) 안유진" id="r" />

      <label for="i">상품선택</label>
      <select id="i">
        <option value="i">상품을 선택해주세요.</option>
        <option value="189000" selected>소과: 18,900원</option>
        <option value="18900" selected>대과: 18,900원</option>
      </select>

      <label for="a">받는분 주소</label>
      <input type="text" placeholder="예) 대전 " id="a" />
      <div>
        <input type="submit" value="주문하기" />
        <input type="button" value="취소" />
        <input type="reset" value="초기화" />
      </div>
    </form>
    <script src="form.js"></script>
  </body>
</html>
